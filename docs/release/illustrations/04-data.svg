<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">Локальное хранение и обновление справочника</title><desc id="desc">Авторская схема для инструкции. Не является скриншотом Google Play Console.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#337d79" stroke-width="1.5"/></marker></defs><rect width="1120" height="430" rx="20" fill="#f0f6f4"/><text x="30" y="32" fill="#4f6867" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.5">СХЕМА · НЕ СКРИНШОТ PLAY CONSOLE</text><g font-family="Arial,sans-serif" fill="#173633"><rect x="30" y="66" width="470" height="270" rx="15" fill="white" stroke="#c5d8d2"/><text x="55" y="107" font-size="23" font-weight="bold">На Android-устройстве</text><text x="55" y="151" font-size="19">• Выбранные страны и настройки</text><text x="55" y="191" font-size="19">• Поездки, даты и заметки</text><text x="55" y="231" font-size="19">• Локальные напоминания</text><text x="55" y="271" font-size="19">• Кэш справочника</text><rect x="680" y="66" width="410" height="270" rx="15" fill="white" stroke="#c5d8d2"/><text x="705" y="107" font-size="23" font-weight="bold">HTTPS-хост справочника</text><text x="705" y="151" font-size="19">Получает запрос файла</text><text x="705" y="191" font-size="19">Видит IP и технические заголовки</text><text x="705" y="231" font-size="19">Логи: проверить правила хоста</text><text x="705" y="286" font-size="17" fill="#4f6867">Нет аккаунта ≠ нет сетевых данных</text><path d="M512 160 L665 160" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M666 248 L513 248" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="589" y="137" font-size="15" text-anchor="middle">Запрос</text><text x="589" y="279" font-size="15" text-anchor="middle">Общий файл</text><rect x="30" y="359" width="1060" height="47" rx="10" fill="#dceddf"/><text x="54" y="389" font-size="17">До релиза подтвердить: поездки не отправляются; хосты, backup и Data safety проверены.</text></g></svg>