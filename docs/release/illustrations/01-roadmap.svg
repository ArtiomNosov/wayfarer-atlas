<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">Путь от подготовки к публикации</title><desc id="desc">Авторская схема для инструкции. Не является скриншотом Google Play Console.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#337d79" stroke-width="1.5"/></marker></defs><rect width="1120" height="430" rx="20" fill="#f0f6f4"/><text x="30" y="32" fill="#4f6867" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.5">СХЕМА · НЕ СКРИНШОТ PLAY CONSOLE</text><g font-family="Arial,sans-serif" fill="#173633"><rect x="30" y="64" width="330" height="130" rx="12" fill="white" stroke="#c5d8d2"/><circle cx="59" cy="95" r="16" fill="#dceddf"/><text x="59" y="100" font-size="14" text-anchor="middle">1</text><text x="85" y="101" font-size="19" font-weight="bold">Аккаунт</text><text x="50" y="136" font-size="16" fill="#4f6867">Страна, тип, проверка</text><text x="50" y="160" font-size="16" fill="#4f6867">Регистрационный сбор Google</text><rect x="395" y="64" width="330" height="130" rx="12" fill="white" stroke="#c5d8d2"/><circle cx="424" cy="95" r="16" fill="#dceddf"/><text x="424" y="100" font-size="14" text-anchor="middle">2</text><text x="450" y="101" font-size="19" font-weight="bold">Проверенная сборка</text><text x="415" y="136" font-size="16" fill="#4f6867">Release AAB и подпись</text><text x="415" y="160" font-size="16" fill="#4f6867">Рабочие RU / EN интерфейсы</text><rect x="760" y="64" width="330" height="130" rx="12" fill="white" stroke="#c5d8d2"/><circle cx="789" cy="95" r="16" fill="#dceddf"/><text x="789" y="100" font-size="14" text-anchor="middle">3</text><text x="815" y="101" font-size="19" font-weight="bold">Карточка и декларации</text><text x="780" y="136" font-size="16" fill="#4f6867">Тексты, реальные скриншоты</text><text x="780" y="160" font-size="16" fill="#4f6867">Политика по HTTPS</text><rect x="30" y="244" width="330" height="130" rx="12" fill="white" stroke="#c5d8d2"/><circle cx="59" cy="275" r="16" fill="#dceddf"/><text x="59" y="280" font-size="14" text-anchor="middle">4</text><text x="85" y="281" font-size="19" font-weight="bold">Тестирование</text><text x="50" y="316" font-size="16" fill="#4f6867">Внутреннее → закрытое</text><text x="50" y="340" font-size="16" fill="#4f6867">12 / 14, если требуется</text><rect x="395" y="244" width="330" height="130" rx="12" fill="white" stroke="#c5d8d2"/><circle cx="424" cy="275" r="16" fill="#dceddf"/><text x="424" y="280" font-size="14" text-anchor="middle">5</text><text x="450" y="281" font-size="19" font-weight="bold">Проверка Google</text><text x="415" y="316" font-size="16" fill="#4f6867">Доступ к production</text><text x="415" y="340" font-size="16" fill="#4f6867">Отдельная проверка релиза</text><rect x="760" y="244" width="330" height="130" rx="12" fill="white" stroke="#c5d8d2"/><circle cx="789" cy="275" r="16" fill="#dceddf"/><text x="789" y="280" font-size="14" text-anchor="middle">6</text><text x="815" y="281" font-size="19" font-weight="bold">Публикация</text><text x="780" y="316" font-size="16" fill="#4f6867">Страны распространения</text><text x="780" y="340" font-size="16" fill="#4f6867">Проверка установки</text><path d="M364 130 L388 130" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M729 130 L753 130" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M364 310 L388 310" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M729 310 L753 310" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="32" y="411" font-size="15" fill="#4f6867">Разработку можно вести параллельно. Оплату, документы и финальную публикацию выполняет владелец.</text></g></svg>