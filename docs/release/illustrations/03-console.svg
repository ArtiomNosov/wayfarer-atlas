<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">Разделы, которые нужно заполнить</title><desc id="desc">Авторская схема для инструкции. Не является скриншотом Google Play Console.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#337d79" stroke-width="1.5"/></marker></defs><rect width="1120" height="430" rx="20" fill="#f0f6f4"/><text x="30" y="32" fill="#4f6867" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.5">СХЕМА · НЕ СКРИНШОТ PLAY CONSOLE</text><g font-family="Arial,sans-serif" fill="#173633"><rect x="30" y="62" width="260" height="322" rx="12" fill="#173633"/><text x="50" y="99" fill="white" font-size="20" font-weight="bold">Ваше приложение</text><text x="51" y="143" fill="#afcebd" font-size="17">Dashboard</text><text x="51" y="186" fill="#ffffff" font-size="17">Store listing</text><text x="51" y="229" fill="#ffffff" font-size="17">App content</text><text x="51" y="272" fill="#ffffff" font-size="17">Testing</text><text x="51" y="315" fill="#ffffff" font-size="17">Production</text><rect x="320" y="62" width="370" height="142" rx="12" fill="white" stroke="#c5d8d2"/><circle cx="349" cy="93" r="16" fill="#dceddf"/><text x="349" y="98" font-size="14" text-anchor="middle">1</text><text x="375" y="99" font-size="19" font-weight="bold">Оформление</text><text x="340" y="134" font-size="16" fill="#4f6867">Карточка RU / EN</text><text x="340" y="158" font-size="16" fill="#4f6867">Политика и контакты</text><text x="340" y="182" font-size="16" fill="#4f6867">Реальные изображения</text><rect x="720" y="62" width="370" height="142" rx="12" fill="white" stroke="#c5d8d2"/><circle cx="749" cy="93" r="16" fill="#dceddf"/><text x="749" y="98" font-size="14" text-anchor="middle">2</text><text x="775" y="99" font-size="19" font-weight="bold">Декларации</text><text x="740" y="134" font-size="16" fill="#4f6867">Data safety</text><text x="740" y="158" font-size="16" fill="#4f6867">Возраст и аудитория</text><text x="740" y="182" font-size="16" fill="#4f6867">Нет рекламы; без входа</text><rect x="320" y="234" width="370" height="150" rx="12" fill="white" stroke="#c5d8d2"/><circle cx="349" cy="265" r="16" fill="#dceddf"/><text x="349" y="270" font-size="14" text-anchor="middle">3</text><text x="375" y="271" font-size="19" font-weight="bold">Тестовый трек</text><text x="340" y="306" font-size="16" fill="#4f6867">AAB → список участников</text><text x="340" y="330" font-size="16" fill="#4f6867">Подключение по ссылке</text><text x="340" y="354" font-size="16" fill="#4f6867">Установка и обратная связь</text><rect x="720" y="234" width="370" height="150" rx="12" fill="white" stroke="#c5d8d2"/><circle cx="749" cy="265" r="16" fill="#dceddf"/><text x="749" y="270" font-size="14" text-anchor="middle">4</text><text x="775" y="271" font-size="19" font-weight="bold">Выпуск</text><text x="740" y="306" font-size="16" fill="#4f6867">Устранить блокеры Dashboard</text><text x="740" y="330" font-size="16" fill="#4f6867">Production access, если нужно</text><text x="740" y="354" font-size="16" fill="#4f6867">Отправить релиз на проверку</text></g></svg>