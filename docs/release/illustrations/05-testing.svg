<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">Непрерывное участие в закрытом тесте</title><desc id="desc">Авторская схема для инструкции. Не является скриншотом Google Play Console.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#337d79" stroke-width="1.5"/></marker></defs><rect width="1120" height="430" rx="20" fill="#f0f6f4"/><text x="30" y="32" fill="#4f6867" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.5">СХЕМА · НЕ СКРИНШОТ PLAY CONSOLE</text><g font-family="Arial,sans-serif" fill="#173633"><text x="32" y="78" font-size="21" font-weight="bold">Если аккаунт личный и создан после 13.11.2023</text><text x="32" y="111" font-size="17">Минимум 12 участников непрерывно подключены к закрытому тесту минимум 14 дней.</text><rect x="70" y="157" width="700" height="48" rx="24" fill="#337d79"/><text x="95" y="188" fill="white" font-size="18">12+ участников: непрерывное участие</text><path d="M781 181 L870 181" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="889" y="145" width="200" height="75" rx="12" fill="white" stroke="#c5d8d2"/><text x="907" y="175" font-size="17">Заявка на</text><text x="907" y="200" font-size="17">production access</text><text x="70" y="239" font-size="17">День 1</text><text x="671" y="239" font-size="17">14 дней и более</text><rect x="70" y="277" width="270" height="30" rx="15" fill="#d4dfd9"/><text x="79" y="343" font-size="16">Выход из теста</text><path d="M350 275 L370 309 M370 275 L350 309" stroke="#b25940" stroke-width="4"/><rect x="415" y="277" width="355" height="30" rx="15" fill="#efc56e"/><text x="418" y="343" font-size="16">Возврат → срок участника заново</text><text x="32" y="400" font-size="16" fill="#4f6867">Добавления email недостаточно: каждый участник сам подключается по ссылке и проверяет приложение.</text></g></svg>