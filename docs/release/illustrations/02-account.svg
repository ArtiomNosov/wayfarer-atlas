<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">Выбор типа аккаунта</title><desc id="desc">Авторская схема для инструкции. Не является скриншотом Google Play Console.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#337d79" stroke-width="1.5"/></marker></defs><rect width="1120" height="430" rx="20" fill="#f0f6f4"/><text x="30" y="32" fill="#4f6867" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.5">СХЕМА · НЕ СКРИНШОТ PLAY CONSOLE</text><g font-family="Arial,sans-serif" fill="#173633"><rect x="30" y="66" width="510" height="225" rx="12" fill="white" stroke="#c5d8d2"/><circle cx="59" cy="97" r="16" fill="#dceddf"/><text x="59" y="102" font-size="14" text-anchor="middle">A</text><text x="85" y="103" font-size="19" font-weight="bold">Личный / Personal</text><text x="50" y="138" font-size="16" fill="#4f6867">Вы выпускаете приложение от себя</text><text x="50" y="162" font-size="16" fill="#4f6867">Реальные данные физического лица</text><text x="50" y="186" font-size="16" fill="#4f6867">Проверка личности и контактов</text><text x="50" y="210" font-size="16" fill="#4f6867">Для нового аккаунта — закрытый тест</text><rect x="580" y="66" width="510" height="225" rx="12" fill="white" stroke="#c5d8d2"/><circle cx="609" cy="97" r="16" fill="#dceddf"/><text x="609" y="102" font-size="14" text-anchor="middle">B</text><text x="635" y="103" font-size="19" font-weight="bold">Организация / Organization</text><text x="600" y="138" font-size="16" fill="#4f6867">Издатель — существующая организация</text><text x="600" y="162" font-size="16" fill="#4f6867">Данные и документы организации</text><text x="600" y="186" font-size="16" fill="#4f6867">D-U-N-S по требованиям Google</text><text x="600" y="210" font-size="16" fill="#4f6867">Не способ обхода личной проверки</text><rect x="30" y="316" width="1060" height="80" rx="12" fill="#fff5dc"/><text x="52" y="348" font-size="18" font-weight="bold">Сначала проверьте реальную страну издателя</text><text x="52" y="375" font-size="16">Язык приложения и страны пользователей не определяют страну регистрации аккаунта.</text></g></svg>